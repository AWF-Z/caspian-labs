<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">One CASP engine, three ways to use it</title>
  <desc id="desc">CASP Core is the direct product, Overlay works with an existing research stack, and Enterprise is a private continuous deployment.</desc>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="48" y="52" fill="#6b7280" font-size="16" font-weight="700" letter-spacing="2.2">ONE CASP ENGINE</text>
    <text x="48" y="102" fill="#111111" font-size="36" font-weight="740" letter-spacing="-1">Three ways to use it</text>

    <line x1="400" y1="148" x2="400" y2="360" stroke="#e5e7eb"/>
    <line x1="800" y1="148" x2="800" y2="360" stroke="#e5e7eb"/>

    <g transform="translate(48 170)">
      <text fill="#111111" font-size="30" font-weight="730">Core</text>
      <text y="52" fill="#374151" font-size="22">Direct product</text>
      <text y="100" fill="#6b7280" font-size="19">For founders, developers,</text>
      <text y="130" fill="#6b7280" font-size="19">and research teams</text>
    </g>

    <g transform="translate(448 170)">
      <text fill="#111111" font-size="30" font-weight="730">Overlay</text>
      <text y="52" fill="#374151" font-size="22">Works with the existing</text>
      <text y="84" fill="#374151" font-size="22">research stack</text>
      <text y="132" fill="#6b7280" font-size="19">Start selected, then expand</text>
    </g>

    <g transform="translate(848 170)">
      <text fill="#111111" font-size="30" font-weight="730">Enterprise</text>
      <text y="52" fill="#374151" font-size="22">Private, continuous</text>
      <text y="84" fill="#374151" font-size="22">deployment</text>
      <text y="132" fill="#6b7280" font-size="19">Governance, connectors,</text>
      <text y="162" fill="#6b7280" font-size="19">and outcome memory</text>
    </g>
  </g>
</svg>
