<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">CASP compared with the complete published WANDR field</title>
  <desc id="desc">On the matched 45-task WANDR comparison, CASP led Perplexity, Anthropic, OpenAI, Exa, Parallel, and Gemini on soft and hard F1.</desc>
  <rect x="0.5" y="0.5" width="1199" height="699" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="48" y="52" fill="#6b7280" font-size="16" font-weight="700" letter-spacing="2.2">WANDR · MATCHED 45 TASKS</text>
    <text x="48" y="102" fill="#111111" font-size="36" font-weight="740" letter-spacing="-1">CASP vs. the published field</text>

    <text x="48" y="156" fill="#6b7280" font-size="16" font-weight="700" letter-spacing="1.5">SYSTEM</text>
    <text x="340" y="156" fill="#6b7280" font-size="16" font-weight="700" letter-spacing="1.5">SOFT F1</text>
    <text x="648" y="156" text-anchor="end" fill="#111111" font-size="18" font-weight="740">+30.5%</text>
    <text x="724" y="156" fill="#6b7280" font-size="16" font-weight="700" letter-spacing="1.5">HARD F1</text>
    <text x="1032" y="156" text-anchor="end" fill="#111111" font-size="18" font-weight="740">+120%</text>
    <text x="1152" y="156" text-anchor="end" fill="#6b7280" font-size="14" font-weight="700" letter-spacing="1.2">SCORED</text>
    <line x1="48" y1="174" x2="1152" y2="174" stroke="#e5e7eb"/>

    <g transform="translate(0 184)">
      <rect x="32" width="1136" height="58" rx="10" fill="#f3f4f6"/>
      <text x="48" y="37" fill="#111111" font-size="22" font-weight="740">CASP</text>
      <rect x="340" y="22" width="230" height="14" rx="7" fill="#111111"/>
      <text x="648" y="37" text-anchor="end" fill="#111111" font-size="20" font-weight="740">0.583</text>
      <rect x="724" y="22" width="230" height="14" rx="7" fill="#111111"/>
      <text x="1032" y="37" text-anchor="end" fill="#111111" font-size="20" font-weight="740">0.493</text>
      <text x="1152" y="37" text-anchor="end" fill="#111111" font-size="16" font-weight="700">45 / 45</text>
    </g>

    <g transform="translate(0 248)">
      <text x="48" y="37" fill="#374151" font-size="20" font-weight="650">Perplexity Search as Code</text>
      <rect x="340" y="22" width="176" height="14" rx="7" fill="#6b7280"/>
      <text x="648" y="37" text-anchor="end" fill="#374151" font-size="20" font-weight="650">0.447</text>
      <rect x="724" y="22" width="104" height="14" rx="7" fill="#6b7280"/>
      <text x="1032" y="37" text-anchor="end" fill="#374151" font-size="20" font-weight="650">0.224</text>
      <text x="1152" y="37" text-anchor="end" fill="#6b7280" font-size="16">44 / 45</text>
    </g>

    <g transform="translate(0 312)">
      <text x="48" y="37" fill="#6b7280" font-size="20">Anthropic Managed Agents</text>
      <rect x="340" y="22" width="103" height="14" rx="7" fill="#b8bec6"/>
      <text x="648" y="37" text-anchor="end" fill="#6b7280" font-size="20">0.262</text>
      <rect x="724" y="22" width="46" height="14" rx="7" fill="#b8bec6"/>
      <text x="1032" y="37" text-anchor="end" fill="#6b7280" font-size="20">0.099</text>
      <text x="1152" y="37" text-anchor="end" fill="#9ca3af" font-size="16">45 / 45</text>
    </g>

    <g transform="translate(0 376)">
      <text x="48" y="37" fill="#6b7280" font-size="20">OpenAI Responses API</text>
      <rect x="340" y="22" width="60" height="14" rx="7" fill="#b8bec6"/>
      <text x="648" y="37" text-anchor="end" fill="#6b7280" font-size="20">0.153</text>
      <rect x="724" y="22" width="34" height="14" rx="7" fill="#b8bec6"/>
      <text x="1032" y="37" text-anchor="end" fill="#6b7280" font-size="20">0.073</text>
      <text x="1152" y="37" text-anchor="end" fill="#9ca3af" font-size="16">45 / 45</text>
    </g>

    <g transform="translate(0 440)">
      <text x="48" y="37" fill="#6b7280" font-size="20">Exa Agent</text>
      <rect x="340" y="22" width="44" height="14" rx="7" fill="#b8bec6"/>
      <text x="648" y="37" text-anchor="end" fill="#6b7280" font-size="20">0.111</text>
      <rect x="724" y="22" width="17" height="14" rx="7" fill="#b8bec6"/>
      <text x="1032" y="37" text-anchor="end" fill="#6b7280" font-size="20">0.036</text>
      <text x="1152" y="37" text-anchor="end" fill="#9ca3af" font-size="16">45 / 45</text>
    </g>

    <g transform="translate(0 504)">
      <text x="48" y="37" fill="#6b7280" font-size="20">Parallel Tasks</text>
      <rect x="340" y="22" width="32" height="14" rx="7" fill="#b8bec6"/>
      <text x="648" y="37" text-anchor="end" fill="#6b7280" font-size="20">0.080</text>
      <rect x="724" y="22" width="16" height="14" rx="7" fill="#b8bec6"/>
      <text x="1032" y="37" text-anchor="end" fill="#6b7280" font-size="20">0.035</text>
      <text x="1152" y="37" text-anchor="end" fill="#9ca3af" font-size="16">45 / 45</text>
    </g>

    <g transform="translate(0 568)">
      <text x="48" y="37" fill="#6b7280" font-size="20">Gemini Deep Research</text>
      <rect x="340" y="22" width="29" height="14" rx="7" fill="#b8bec6"/>
      <text x="648" y="37" text-anchor="end" fill="#6b7280" font-size="20">0.074</text>
      <rect x="724" y="22" width="13" height="14" rx="7" fill="#b8bec6"/>
      <text x="1032" y="37" text-anchor="end" fill="#6b7280" font-size="20">0.028</text>
      <text x="1152" y="37" text-anchor="end" fill="#9ca3af" font-size="16">45 / 45</text>
    </g>

    <line x1="48" y1="642" x2="1152" y2="642" stroke="#e5e7eb"/>
    <text x="48" y="674" fill="#4b5563" font-size="16">Published leader: Perplexity Search as Code</text>
    <text x="1152" y="674" text-anchor="end" fill="#4b5563" font-size="16">Official evaluator</text>
