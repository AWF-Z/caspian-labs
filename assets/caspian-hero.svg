<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
  <title id="title">Caspian Labs and CASP</title>
  <desc id="desc">CASP turns models, research, files, and data into stronger opportunity decisions and outcome learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101c"/>
      <stop offset="0.58" stop-color="#0b1628"/>
      <stop offset="1" stop-color="#0d2131"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56e7c2"/>
      <stop offset="1" stop-color="#70a7ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#56e7c2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#56e7c2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#9db4cf" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="680" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="680" rx="28" fill="url(#grid)"/>
  <circle cx="1090" cy="330" r="330" fill="url(#glow)"/>

  <g transform="translate(72 68)">
    <g>
      <rect width="18" height="18" rx="4" fill="#56e7c2"/>
      <rect x="24" width="18" height="18" rx="4" fill="#70a7ff"/>
      <rect y="24" width="18" height="18" rx="4" fill="#70a7ff"/>
      <rect x="24" y="24" width="18" height="18" rx="4" fill="#56e7c2" fill-opacity="0.58"/>
      <text x="64" y="34" fill="#f4f8ff" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="720" letter-spacing="4">CASPIAN LABS</text>
    </g>

    <text y="135" fill="#56e7c2" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4">OPPORTUNITY INTELLIGENCE</text>
    <text y="205" fill="#f7f9fd" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="760" letter-spacing="-2">Find what others miss.</text>
    <text y="274" fill="#f7f9fd" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="760" letter-spacing="-2">Make the next move clear.</text>
    <text y="330" fill="#aab9ce" font-family="Inter,Arial,sans-serif" font-size="22">CASP searches beyond the obvious frame, completes the evidence,</text>
    <text y="363" fill="#aab9ce" font-family="Inter,Arial,sans-serif" font-size="22">and learns from what happens after the decision.</text>

    <g transform="translate(0 420)">
      <rect width="160" height="48" rx="24" fill="#102034" stroke="#2b455e"/>
      <circle cx="24" cy="24" r="5" fill="#56e7c2"/>
      <text x="41" y="30" fill="#e4ecf7" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" letter-spacing="1">DISCOVER</text>
      <rect x="174" width="144" height="48" rx="24" fill="#102034" stroke="#2b455e"/>
      <circle cx="198" cy="24" r="5" fill="#70a7ff"/>
      <text x="215" y="30" fill="#e4ecf7" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" letter-spacing="1">DECIDE</text>
      <rect x="332" width="132" height="48" rx="24" fill="#102034" stroke="#2b455e"/>
      <circle cx="356" cy="24" r="5" fill="#f4bd5e"/>
      <text x="373" y="30" fill="#e4ecf7" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650" letter-spacing="1">LEARN</text>
    </g>
  </g>

  <g transform="translate(630 102)">
    <g font-family="Inter,Arial,sans-serif" font-size="13" font-weight="680" letter-spacing="1.2" fill="#becbdd">
      <rect x="0" y="18" width="150" height="48" rx="24" fill="#0f1c2d" stroke="#30465d"/><text x="75" y="47" text-anchor="middle">MODELS</text>
      <rect x="-25" y="92" width="150" height="48" rx="24" fill="#0f1c2d" stroke="#30465d"/><text x="50" y="121" text-anchor="middle">RESEARCH</text>
      <rect x="-25" y="328" width="150" height="48" rx="24" fill="#0f1c2d" stroke="#30465d"/><text x="50" y="357" text-anchor="middle">FILES</text>
      <rect x="0" y="402" width="150" height="48" rx="24" fill="#0f1c2d" stroke="#30465d"/><text x="75" y="431" text-anchor="middle">DATA</text>
    </g>

    <g fill="none" stroke="#4b6882" stroke-width="2">
      <path d="M150 42C220 42 228 172 288 205"/>
      <path d="M125 116C205 116 226 184 288 214"/>
      <path d="M125 352C205 352 226 282 288 252"/>
      <path d="M150 426C220 426 228 296 288 263"/>
    </g>

    <circle cx="382" cy="234" r="122" fill="#09131f" stroke="url(#accent)" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="382" cy="234" r="100" fill="#0c1928" stroke="#2a4a62" stroke-width="1.5"/>
    <text x="382" y="208" text-anchor="middle" fill="#91a5bd" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" letter-spacing="4">CASPIAN LABS</text>
    <text x="382" y="251" text-anchor="middle" fill="#f5f8fc" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="780" letter-spacing="4">CASP</text>
    <text x="382" y="280" text-anchor="middle" fill="#56e7c2" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="650" letter-spacing="2">ONE RESEARCH ENGINE</text>

    <path d="M505 234H570" stroke="#56e7c2" stroke-width="3"/>
    <path d="M558 222L572 234L558 246" fill="none" stroke="#56e7c2" stroke-width="3"/>

    <g transform="translate(588 144)">
      <rect width="220" height="180" rx="20" fill="#101f31" stroke="#345069"/>
      <rect x="20" y="22" width="180" height="30" rx="15" fill="#142c3e"/>
      <circle cx="40" cy="37" r="5" fill="#56e7c2"/>
      <text x="54" y="42" fill="#dce7f5" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">STRONGEST MOVE</text>
      <rect x="20" y="76" width="154" height="11" rx="5.5" fill="#49627b"/>
      <rect x="20" y="100" width="118" height="11" rx="5.5" fill="#3c526a"/>
      <rect x="20" y="124" width="170" height="11" rx="5.5" fill="#425a72"/>
      <rect x="20" y="150" width="88" height="18" rx="9" fill="#183f45"/>
      <text x="64" y="163" text-anchor="middle" fill="#56e7c2" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="720" letter-spacing="1">TEST NEXT</text>
    </g>

    <path d="M695 324C705 410 585 480 458 372" fill="none" stroke="#f4bd5e" stroke-width="2" stroke-dasharray="8 9"/>
    <rect x="502" y="430" width="232" height="48" rx="24" fill="#112034" stroke="#3b5069"/>
    <circle cx="526" cy="454" r="5" fill="#f4bd5e"/>
    <text x="542" y="459" fill="#dce7f5" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="670" letter-spacing="1">OUTCOME LEARNING</text>
  </g>
</svg>
