<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
  <title id="title">Caspian Labs and CASP</title>
  <desc id="desc">CASP discovers what conventional AI and research miss, makes the strongest next move clear, and learns from the outcome.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#28302c" stroke-width="1" opacity="0.34"/>
    </pattern>
  </defs>
  <rect width="1440" height="600" rx="28" fill="#090c0a"/>
  <rect width="1440" height="600" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1438" height="598" rx="27" fill="none" stroke="#313a35" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(64 52)">
      <rect width="22" height="22" rx="4" fill="none" stroke="#65e6b3" stroke-width="2"/>
      <path d="M4 11h14M11 4v14" stroke="#65e6b3" stroke-width="1.5" opacity="0.78"/>
      <circle cx="15.5" cy="7" r="2.6" fill="#f5f1e8"/>
      <text x="36" y="18" fill="#f5f1e8" font-size="19" font-weight="720" letter-spacing="2.5">CASPIAN LABS</text>
    </g>
    <text x="1376" y="70" text-anchor="end" fill="#8fa097" font-size="16" font-weight="650" letter-spacing="1.8">OPPORTUNITY INTELLIGENCE</text>
    <text x="64" y="168" fill="#f5f1e8" font-size="60" font-weight="760" letter-spacing="-2.2">CASP finds what conventional</text>
    <text x="64" y="238" fill="#65e6b3" font-size="60" font-weight="760" letter-spacing="-2.2">AI and research miss.</text>
    <text x="64" y="292" fill="#b5c0ba" font-size="23" font-weight="430">Discover stronger directions. Make the next move clear. Learn from the outcome.</text>
    <g transform="translate(64 344)">
      <rect width="386" height="128" rx="18" fill="#121713" stroke="#344039"/>
      <text x="24" y="34" fill="#65e6b3" font-size="14" font-weight="760" letter-spacing="2">01 · SEARCH WIDER</text>
      <text x="24" y="76" fill="#f5f1e8" font-size="27" font-weight="700">Build the opportunity field</text>
      <text x="24" y="104" fill="#95a39b" font-size="17">Beyond the obvious framing</text>
    </g>
    <path d="M468 408h34" stroke="#65e6b3" stroke-width="2"/>
    <path d="m494 400 10 8-10 8" fill="none" stroke="#65e6b3" stroke-width="2"/>
    <g transform="translate(522 344)">
      <rect width="386" height="128" rx="18" fill="#15231d" stroke="#65e6b3" stroke-width="2"/>
      <text x="24" y="34" fill="#65e6b3" font-size="14" font-weight="760" letter-spacing="2">02 · COMPLETE THE EVIDENCE</text>
      <text x="24" y="76" fill="#f5f1e8" font-size="27" font-weight="700">Make directions testable</text>
      <text x="24" y="104" fill="#b5c0ba" font-size="17">Evidence, uncertainty, next test</text>
    </g>
    <path d="M926 408h34" stroke="#65e6b3" stroke-width="2"/>
    <path d="m952 400 10 8-10 8" fill="none" stroke="#65e6b3" stroke-width="2"/>
    <g transform="translate(980 344)">
      <rect width="396" height="128" rx="18" fill="#121713" stroke="#344039"/>
      <text x="24" y="34" fill="#65e6b3" font-size="14" font-weight="760" letter-spacing="2">03 · DECIDE AND LEARN</text>
      <text x="24" y="76" fill="#f5f1e8" font-size="27" font-weight="700">Make the next move clear</text>
      <text x="24" y="104" fill="#95a39b" font-size="17">Preserve the outcome</text>
    </g>
    <line x1="64" y1="520" x2="1376" y2="520" stroke="#313a35"/>
    <text x="64" y="558" fill="#b5c0ba" font-size="17" font-weight="600">WANDR · MATCHED 45 TASKS</text>
    <text x="346" y="558" fill="#65e6b3" font-size="20" font-weight="760">+30.5%</text>
    <text x="438" y="558" fill="#b5c0ba" font-size="17">research quality + coverage</text>
    <text x="776" y="558" fill="#65e6b3" font-size="20" font-weight="760">+120%</text>
    <text x="854" y="558" fill="#b5c0ba" font-size="17">strict completion</text>
    <text x="1376" y="558" text-anchor="end" fill="#f5f1e8" font-size="17" font-weight="680">45 / 45 official task scores</text>
  </g>
</svg>
