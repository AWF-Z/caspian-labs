<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">CASP compared with the complete published WANDR field</title>
  <desc id="desc">On the matched 45-task WANDR comparison, CASP led Perplexity, Anthropic, OpenAI, Exa, Parallel, and Gemini on soft and hard F1.</desc>
  <rect x="0.5" y="0.5" width="1439" height="719" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="64" y="62" fill="#6b7280" font-size="15" font-weight="700" letter-spacing="2.4">WANDR · MATCHED 45 TASKS</text>
    <text x="64" y="114" fill="#111111" font-size="38" font-weight="740" letter-spacing="-1">CASP vs. the published field</text>

    <g transform="translate(64 172)">
      <text y="0" fill="#6b7280" font-size="14" font-weight="700" letter-spacing="1.8">SOFT F1</text>
      <text x="600" y="0" text-anchor="end" fill="#111111" font-size="21" font-weight="740">CASP +30.5%</text>

      <g transform="translate(0 48)">
        <text y="17" fill="#111111" font-size="17" font-weight="720">CASP</text>
        <rect x="232" y="5" width="300" height="12" rx="6" fill="#111111"/>
        <text x="600" y="17" text-anchor="end" fill="#111111" font-size="17" font-weight="720">0.583</text>
      </g>
      <g transform="translate(0 102)">
        <text y="17" fill="#4b5563" font-size="16">Perplexity Search as Code</text>
        <rect x="232" y="5" width="230" height="12" rx="6" fill="#6b7280"/>
        <text x="600" y="17" text-anchor="end" fill="#4b5563" font-size="16" font-weight="650">0.447</text>
      </g>
      <g transform="translate(0 156)">
        <text y="17" fill="#6b7280" font-size="16">Anthropic Managed Agents</text>
        <rect x="232" y="5" width="135" height="12" rx="6" fill="#b8bec6"/>
        <text x="600" y="17" text-anchor="end" fill="#6b7280" font-size="16">0.262</text>
      </g>
      <g transform="translate(0 210)">
        <text y="17" fill="#6b7280" font-size="16">OpenAI Responses API</text>
        <rect x="232" y="5" width="79" height="12" rx="6" fill="#b8bec6"/>
        <text x="600" y="17" text-anchor="end" fill="#6b7280" font-size="16">0.153</text>
      </g>
      <g transform="translate(0 264)">
        <text y="17" fill="#6b7280" font-size="16">Exa Agent</text>
        <rect x="232" y="5" width="57" height="12" rx="6" fill="#b8bec6"/>
        <text x="600" y="17" text-anchor="end" fill="#6b7280" font-size="16">0.111</text>
      </g>
      <g transform="translate(0 318)">
        <text y="17" fill="#6b7280" font-size="16">Parallel Tasks</text>
        <rect x="232" y="5" width="41" height="12" rx="6" fill="#b8bec6"/>
        <text x="600" y="17" text-anchor="end" fill="#6b7280" font-size="16">0.080</text>
      </g>
      <g transform="translate(0 372)">
        <text y="17" fill="#6b7280" font-size="16">Gemini Deep Research</text>
        <rect x="232" y="5" width="38" height="12" rx="6" fill="#b8bec6"/>
        <text x="600" y="17" text-anchor="end" fill="#6b7280" font-size="16">0.074</text>
      </g>
    </g>

    <line x1="720" y1="172" x2="720" y2="594" stroke="#e5e7eb"/>

    <g transform="translate(784 172)">
      <text y="0" fill="#6b7280" font-size="14" font-weight="700" letter-spacing="1.8">HARD F1</text>
      <text x="592" y="0" text-anchor="end" fill="#111111" font-size="21" font-weight="740">CASP +120%</text>

      <g transform="translate(0 48)">
        <text y="17" fill="#111111" font-size="17" font-weight="720">CASP</text>
        <rect x="232" y="5" width="300" height="12" rx="6" fill="#111111"/>
        <text x="592" y="17" text-anchor="end" fill="#111111" font-size="17" font-weight="720">0.493</text>
      </g>
      <g transform="translate(0 102)">
        <text y="17" fill="#4b5563" font-size="16">Perplexity Search as Code</text>
        <rect x="232" y="5" width="136" height="12" rx="6" fill="#6b7280"/>
        <text x="592" y="17" text-anchor="end" fill="#4b5563" font-size="16" font-weight="650">0.224</text>
      </g>
      <g transform="translate(0 156)">
        <text y="17" fill="#6b7280" font-size="16">Anthropic Managed Agents</text>
        <rect x="232" y="5" width="60" height="12" rx="6" fill="#b8bec6"/>
        <text x="592" y="17" text-anchor="end" fill="#6b7280" font-size="16">0.099</text>
      </g>
      <g transform="translate(0 210)">
        <text y="17" fill="#6b7280" font-size="16">OpenAI Responses API</text>
        <rect x="232" y="5" width="44" height="12" rx="6" fill="#b8bec6"/>
        <text x="592" y="17" text-anchor="end" fill="#6b7280" font-size="16">0.073</text>
      </g>
      <g transform="translate(0 264)">
        <text y="17" fill="#6b7280" font-size="16">Exa Agent</text>
        <rect x="232" y="5" width="22" height="12" rx="6" fill="#b8bec6"/>
        <text x="592" y="17" text-anchor="end" fill="#6b7280" font-size="16">0.036</text>
      </g>
      <g transform="translate(0 318)">
        <text y="17" fill="#6b7280" font-size="16">Parallel Tasks</text>
        <rect x="232" y="5" width="21" height="12" rx="6" fill="#b8bec6"/>
        <text x="592" y="17" text-anchor="end" fill="#6b7280" font-size="16">0.035</text>
      </g>
      <g transform="translate(0 372)">
        <text y="17" fill="#6b7280" font-size="16">Gemini Deep Research</text>
        <rect x="232" y="5" width="17" height="12" rx="6" fill="#b8bec6"/>
        <text x="592" y="17" text-anchor="end" fill="#6b7280" font-size="16">0.028</text>
      </g>
    </g>

    <line x1="64" y1="626" x2="1376" y2="626" stroke="#e5e7eb"/>
    <text x="64" y="670" fill="#4b5563" font-size="16">Published leader: Perplexity Search as Code</text>
    <text x="1376" y="670" text-anchor="end" fill="#4b5563" font-size="16">Official evaluator · 45 / 45 CASP task scores</text>
  </g>
</svg>
