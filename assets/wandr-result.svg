<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
  <title id="title">CASP led the complete matched WANDR production field</title>
  <desc id="desc">On the matched 45-task WANDR comparison, CASP scored 0.583 soft F1 and 0.493 hard F1, 30.5 percent and 120 percent above the strongest published production result.</desc>
  <rect width="1400" height="930" rx="28" fill="#090c0a"/>
  <rect x="1" y="1" width="1398" height="928" rx="27" fill="none" stroke="#313a35" stroke-width="2"/>
