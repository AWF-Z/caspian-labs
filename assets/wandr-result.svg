<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">CASP compared with the published WANDR leader</title>
  <desc id="desc">On the matched 45-task WANDR comparison, CASP scored 30.5 percent higher on soft F1 and 120 percent higher on hard F1.</desc>
  <rect x="0.5" y="0.5" width="1439" height="559" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="64" y="62" fill="#6b7280" font-size="15" font-weight="700" letter-spacing="2.4">WANDR · MATCHED 45 TASKS</text>
    <text x="64" y="114" fill="#111111" font-size="38" font-weight="740" letter-spacing="-1">CASP vs. the published leader</text>

    <g transform="translate(64 172)">
      <text y="0" fill="#6b7280" font-size="14" font-weight="700" letter-spacing="1.8">SOFT F1</text>
      <text y="62" fill="#111111" font-size="44" font-weight="760">0.583</text>
      <text x="142" y="55" fill="#111111" font-size="18" font-weight="650">CASP</text>
      <rect x="142" y="72" width="360" height="12" rx="6" fill="#111111"/>
      <text y="126" fill="#6b7280" font-size="30" font-weight="700">0.447</text>
      <text x="142" y="120" fill="#6b7280" font-size="17">Published leader</text>
      <rect x="142" y="137" width="276" height="12" rx="6" fill="#b8bec6"/>
      <text x="572" y="48" text-anchor="end" fill="#111111" font-size="28" font-weight="740">+30.5%</text>
    </g>

    <line x1="720" y1="172" x2="720" y2="402" stroke="#e5e7eb"/>

    <g transform="translate(784 172)">
      <text y="0" fill="#6b7280" font-size="14" font-weight="700" letter-spacing="1.8">HARD F1</text>
      <text y="62" fill="#111111" font-size="44" font-weight="760">0.493</text>
      <text x="142" y="55" fill="#111111" font-size="18" font-weight="650">CASP</text>
      <rect x="142" y="72" width="360" height="12" rx="6" fill="#111111"/>
      <text y="126" fill="#6b7280" font-size="30" font-weight="700">0.224</text>
      <text x="142" y="120" fill="#6b7280" font-size="17">Published leader</text>
      <rect x="142" y="137" width="164" height="12" rx="6" fill="#b8bec6"/>
      <text x="572" y="48" text-anchor="end" fill="#111111" font-size="28" font-weight="740">+120%</text>
    </g>

    <line x1="64" y1="448" x2="1376" y2="448" stroke="#e5e7eb"/>
    <text x="64" y="488" fill="#4b5563" font-size="16">Published leader: Perplexity Search as Code</text>
    <text x="64" y="520" fill="#9ca3af" font-size="14">Compared field: Perplexity · Anthropic · OpenAI · Exa · Parallel · Gemini</text>
    <text x="1376" y="488" text-anchor="end" fill="#4b5563" font-size="16">Official evaluator · 45 / 45 CASP task scores</text>
  </g>
</svg>
