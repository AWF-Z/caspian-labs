    <text x="64" y="121" fill="#f5f1e8" font-size="43" font-weight="760" letter-spacing="-1.2">CASP led the complete published production field.</text>
    <text x="64" y="158" fill="#aeb9b3" font-size="19">Best published setting for every system on the same 45 tasks.</text>

