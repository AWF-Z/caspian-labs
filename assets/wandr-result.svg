      <text x="228" y="80" fill="#f5f1e8" font-size="20" font-weight="680">above the published leader</text>
      <text x="228" y="108" fill="#91a098" font-size="16">0.583 vs 0.447 soft F1</text>
    </g>
    <g transform="translate(718 198)">
      <rect width="618" height="132" rx="18" fill="#15231d" stroke="#65e6b3" stroke-width="2"/>
      <text x="26" y="34" fill="#aeb9b3" font-size="13" font-weight="720" letter-spacing="1.5">STRICT COMPLETION</text>
      <text x="26" y="92" fill="#65e6b3" font-size="48" font-weight="790">+120%</text>
      <text x="208" y="80" fill="#f5f1e8" font-size="20" font-weight="680">above the published leader</text>
      <text x="208" y="108" fill="#91a098" font-size="16">0.493 vs 0.224 hard F1 · equivalent to 2.20×</text>
