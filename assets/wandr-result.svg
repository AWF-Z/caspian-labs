<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title desc">
  <title id="title">CASP led the matched WANDR field</title>
  <desc id="desc">CASP scored 0.583 soft F1 and 0.493 hard F1, ahead of the best published production system result at 0.447 and 0.224.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101c"/><stop offset="1" stop-color="#0c1d2b"/></linearGradient>
    <linearGradient id="casp" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#56e7c2"/><stop offset="1" stop-color="#70a7ff"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#9db4cf" stroke-opacity="0.045"/></pattern>
  </defs>
  <rect width="1440" height="930" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="930" rx="28" fill="url(#grid)"/>

  <text x="72" y="78" fill="#56e7c2" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="720" letter-spacing="4">WANDR · MATCHED 45 TASKS · OFFICIAL EVALUATOR</text>
  <text x="72" y="139" fill="#f5f8fc" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="760" letter-spacing="-1">Against the published production field, CASP finished first.</text>
  <text x="72" y="180" fill="#a9b8cc" font-family="Inter,Arial,sans-serif" font-size="19">Best published setting for each system on the identical matched task subset.</text>

  <g transform="translate(72 220)">
    <rect width="620" height="120" rx="18" fill="#101e30" stroke="#2e465e"/>
    <text x="28" y="35" fill="#93a7bf" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">RESEARCH QUALITY + COVERAGE</text>
    <text x="28" y="88" fill="#56e7c2" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="780">+30.5%</text>
    <text x="218" y="82" fill="#e9f0f8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="620">higher soft F1 than the published leader</text>
    <text x="218" y="105" fill="#899db5" font-family="Inter,Arial,sans-serif" font-size="14">0.583 versus 0.447</text>

    <rect x="648" width="648" height="120" rx="18" fill="#101e30" stroke="#2e465e"/>
    <text x="676" y="35" fill="#93a7bf" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">STRICT COMPLETION</text>
    <text x="676" y="88" fill="#70a7ff" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="780">2.20×</text>
    <text x="842" y="82" fill="#e9f0f8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="620">the published leader's hard F1</text>
    <text x="842" y="105" fill="#899db5" font-family="Inter,Arial,sans-serif" font-size="14">0.493 versus 0.224</text>
  </g>

  <g transform="translate(72 385)" font-family="Inter,Arial,sans-serif">
    <text x="0" y="0" fill="#7f94ad" font-size="12" font-weight="700" letter-spacing="2">SYSTEM</text>
    <text x="740" y="0" fill="#7f94ad" font-size="12" font-weight="700" letter-spacing="2">SOFT F1</text>
    <text x="1035" y="0" fill="#7f94ad" font-size="12" font-weight="700" letter-spacing="2">HARD F1</text>
    <line x1="0" y1="22" x2="1296" y2="22" stroke="#2a4056"/>

    <g transform="translate(0 48)">
      <rect x="-18" y="-22" width="1332" height="72" rx="14" fill="#102b33" stroke="#2f7469"/>
      <text y="14" fill="#f4f8fc" font-size="18" font-weight="760">CASP 5.0</text><text x="150" y="14" fill="#56e7c2" font-size="13" font-weight="650">CASPIAN LABS</text>
      <rect x="355" y="-1" width="340" height="16" rx="8" fill="#1f3d4b"/><rect x="355" y="-1" width="330" height="16" rx="8" fill="url(#casp)"/>
      <text x="740" y="14" fill="#f4f8fc" font-size="18" font-weight="760">0.583</text>
      <rect x="835" y="-1" width="170" height="16" rx="8" fill="#1f3d4b"/><rect x="835" y="-1" width="168" height="16" rx="8" fill="url(#casp)"/>
      <text x="1035" y="14" fill="#f4f8fc" font-size="18" font-weight="760">0.493</text>
      <text x="1190" y="14" fill="#56e7c2" font-size="13" font-weight="700">45 / 45</text>
    </g>

