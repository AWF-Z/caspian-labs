      <g transform="translate(0 270)"><text>OpenAI Responses API</text><text x="260" fill="#8297af" font-size="12">high</text><rect x="355" y="-2" width="340" height="14" rx="7" fill="#1a2a3c"/><rect x="355" y="-2" width="87" height="14" rx="7" fill="#586d84"/><text x="740" y="12">0.153</text><rect x="835" y="-2" width="170" height="14" rx="7" fill="#1a2a3c"/><rect x="835" y="-2" width="25" height="14" rx="7" fill="#586d84"/><text x="1035" y="12">0.073</text><text x="1190" y="12" fill="#8297af" font-size="13">45 / 45</text></g>
      <g transform="translate(0 340)"><text>Exa Agent</text><text x="260" fill="#8297af" font-size="12">xhigh</text><rect x="355" y="-2" width="340" height="14" rx="7" fill="#1a2a3c"/><rect x="355" y="-2" width="63" height="14" rx="7" fill="#52677f"/><text x="740" y="12">0.111</text><rect x="835" y="-2" width="170" height="14" rx="7" fill="#1a2a3c"/><rect x="835" y="-2" width="12" height="14" rx="7" fill="#52677f"/><text x="1035" y="12">0.036</text><text x="1190" y="12" fill="#8297af" font-size="13">45 / 45</text></g>
      <g transform="translate(0 410)"><text>Parallel Tasks</text><text x="260" fill="#8297af" font-size="12">ultra8x</text><rect x="355" y="-2" width="340" height="14" rx="7" fill="#1a2a3c"/><rect x="355" y="-2" width="45" height="14" rx="7" fill="#4c6179"/><text x="740" y="12">0.080</text><rect x="835" y="-2" width="170" height="14" rx="7" fill="#1a2a3c"/><rect x="835" y="-2" width="12" height="14" rx="7" fill="#4c6179"/><text x="1035" y="12">0.035</text><text x="1190" y="12" fill="#8297af" font-size="13">45 / 45</text></g>
      <g transform="translate(0 480)"><text>Gemini Deep Research</text><text x="260" fill="#8297af" font-size="12">max</text><rect x="355" y="-2" width="340" height="14" rx="7" fill="#1a2a3c"/><rect x="355" y="-2" width="42" height="14" rx="7" fill="#465b73"/><text x="740" y="12">0.074</text><rect x="835" y="-2" width="170" height="14" rx="7" fill="#1a2a3c"/><rect x="835" y="-2" width="10" height="14" rx="7" fill="#465b73"/><text x="1035" y="12">0.028</text><text x="1190" y="12" fill="#8297af" font-size="13">45 / 45</text></g>
    </g>
  </g>

  <text x="72" y="900" fill="#71869f" font-family="Inter,Arial,sans-serif" font-size="13">Comparator maxima: WANDR Table 6. CASP: sealed official-evaluator aggregate. Soft F1 combines research quality and coverage. Hard F1 requires complete evidence structure.</text>
</svg>
