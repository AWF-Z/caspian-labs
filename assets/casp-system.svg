<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">One CASP engine, three ways to use it</title>
  <desc id="desc">CASP Core is the direct product, Overlay works with an existing research stack, and Enterprise is a private continuous deployment.</desc>
  <rect x="0.5" y="0.5" width="1439" height="359" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="64" y="62" fill="#6b7280" font-size="15" font-weight="700" letter-spacing="2.4">ONE CASP ENGINE</text>
    <text x="64" y="114" fill="#111111" font-size="38" font-weight="740" letter-spacing="-1">Three ways to use it</text>

    <line x1="480" y1="158" x2="480" y2="302" stroke="#e5e7eb"/>
    <line x1="960" y1="158" x2="960" y2="302" stroke="#e5e7eb"/>

    <g transform="translate(64 178)">
      <text fill="#111111" font-size="27" font-weight="730">Core</text>
      <text y="44" fill="#4b5563" font-size="18">Direct product</text>
      <text y="82" fill="#9ca3af" font-size="16">For founders, developers, and research teams</text>
    </g>
    <g transform="translate(544 178)">
      <text fill="#111111" font-size="27" font-weight="730">Overlay</text>
      <text y="44" fill="#4b5563" font-size="18">Works with the existing research stack</text>
      <text y="82" fill="#9ca3af" font-size="16">Start with selected evidence, then expand</text>
    </g>
    <g transform="translate(1024 178)">
      <text fill="#111111" font-size="27" font-weight="730">Enterprise</text>
      <text y="44" fill="#4b5563" font-size="18">Private, continuous deployment</text>
      <text y="82" fill="#9ca3af" font-size="16">Governance, connectors, and outcome memory</text>
    </g>
  </g>
</svg>
