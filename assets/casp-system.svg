<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">One CASP engine, three ways to use it</title>
  <desc id="desc">CASP Core provides direct research, CASP Overlay strengthens an existing research stack, and CASP Enterprise provides a private continuous system.</desc>
  <rect width="1400" height="650" rx="28" fill="#f5f1e8"/>
  <rect x="1" y="1" width="1398" height="648" rx="27" fill="none" stroke="#c9c3b8" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="64" y="62" fill="#187954" font-size="15" font-weight="780" letter-spacing="2.4">ONE CASP RESEARCH ENGINE</text>
    <text x="64" y="119" fill="#111512" font-size="42" font-weight="770" letter-spacing="-1.2">Direct when you need it. Integrated when you are ready.</text>
    <text x="64" y="157" fill="#59635d" font-size="19">The capability stays the same. Integration, privacy, and organizational memory expand.</text>

    <g transform="translate(64 210)">
      <g>
        <rect width="392" height="290" rx="20" fill="#fffdf7" stroke="#c9c3b8"/>
        <text x="28" y="42" fill="#187954" font-size="14" font-weight="780" letter-spacing="1.8">01 · DIRECT</text>
        <text x="28" y="88" fill="#111512" font-size="31" font-weight="760">CASP Core</text>
        <text x="28" y="130" fill="#424c46" font-size="18">A standalone research product</text>
        <text x="28" y="158" fill="#424c46" font-size="18">for founders, developers,</text>
        <text x="28" y="186" fill="#424c46" font-size="18">researchers, and product teams.</text>
        <line x1="28" y1="224" x2="364" y2="224" stroke="#d8d2c7"/>
        <text x="28" y="258" fill="#657068" font-size="15" font-weight="650">Product · supported AI host · API</text>
      </g>

      <g transform="translate(420)">
        <rect width="392" height="290" rx="20" fill="#111713" stroke="#187954" stroke-width="2"/>
        <text x="28" y="42" fill="#65e6b3" font-size="14" font-weight="780" letter-spacing="1.8">02 · INTEGRATED</text>
        <text x="28" y="88" fill="#f5f1e8" font-size="31" font-weight="760">CASP Overlay</text>
        <text x="28" y="130" fill="#b9c3bd" font-size="18">Strengthens the research systems</text>
        <text x="28" y="158" fill="#b9c3bd" font-size="18">a team already uses. Start with</text>
        <text x="28" y="186" fill="#b9c3bd" font-size="18">selected evidence, then expand.</text>
        <line x1="28" y1="224" x2="364" y2="224" stroke="#344039"/>
        <text x="28" y="258" fill="#65e6b3" font-size="15" font-weight="650">Minimum trust surface · no rip-and-replace</text>
      </g>

      <g transform="translate(840)">
        <rect width="432" height="290" rx="20" fill="#fffdf7" stroke="#c9c3b8"/>
        <text x="28" y="42" fill="#187954" font-size="14" font-weight="780" letter-spacing="1.8">03 · PRIVATE + CONTINUOUS</text>
        <text x="28" y="88" fill="#111512" font-size="31" font-weight="760">CASP Enterprise</text>
        <text x="28" y="130" fill="#424c46" font-size="18">Private deployment, governance,</text>
        <text x="28" y="158" fill="#424c46" font-size="18">approved connectors, continuous</text>
        <text x="28" y="186" fill="#424c46" font-size="18">research, and outcome memory.</text>
        <line x1="28" y1="224" x2="404" y2="224" stroke="#d8d2c7"/>
        <text x="28" y="258" fill="#657068" font-size="15" font-weight="650">Customer VPC · controls · auditability</text>
      </g>
    </g>

    <g transform="translate(64 548)">
      <text y="26" fill="#187954" font-size="14" font-weight="780" letter-spacing="1.8">SAME CASP ENGINE</text>
      <line x1="190" y1="20" x2="1260" y2="20" stroke="#a9b1ab" stroke-width="2"/>
      <circle cx="350" cy="20" r="7" fill="#187954"/>
      <circle cx="720" cy="20" r="7" fill="#187954"/>
      <circle cx="1090" cy="20" r="7" fill="#187954"/>
      <text x="350" y="58" text-anchor="middle" fill="#424c46" font-size="16" font-weight="650">Direct access</text>
      <text x="720" y="58" text-anchor="middle" fill="#424c46" font-size="16" font-weight="650">Recurring overlay</text>
      <text x="1090" y="58" text-anchor="middle" fill="#424c46" font-size="16" font-weight="650">Private deployment</text>
    </g>
  </g>
</svg>
