<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">One CASP engine, three ways to use it</title>
  <desc id="desc">CASP Core is the direct product, Overlay works with an existing research stack, and Enterprise is a private continuous deployment.</desc>
  <rect x="0.5" y="0.5" width="1199" height="499" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="48" y="60" fill="#6b7280" font-size="16" font-weight="700" letter-spacing="2.2">ONE CASP ENGINE</text>
    <text x="48" y="115" fill="#111111" font-size="36" font-weight="740" letter-spacing="-1">Three ways to use it</text>
    <line x1="48" y1="160" x2="1152" y2="160" stroke="#e5e7eb"/>

    <line x1="400" y1="202" x2="400" y2="438" stroke="#e5e7eb"/>
    <line x1="800" y1="202" x2="800" y2="438" stroke="#e5e7eb"/>

    <g transform="translate(48 224)">
      <text fill="#111111" font-size="28" font-weight="730">Core</text>
      <text y="56" fill="#374151" font-size="20">Direct product</text>
      <text y="110" fill="#6b7280" font-size="18">For founders, developers,</text>
      <text y="140" fill="#6b7280" font-size="18">and research teams</text>
    </g>

    <g transform="translate(448 224)">
      <text fill="#111111" font-size="28" font-weight="730">Overlay</text>
      <text y="56" fill="#374151" font-size="20">Works with the existing</text>
      <text y="88" fill="#374151" font-size="20">research stack</text>
      <text y="142" fill="#6b7280" font-size="18">Start selected, then expand</text>
    </g>

    <g transform="translate(848 224)">
      <text fill="#111111" font-size="28" font-weight="730">Enterprise</text>
      <text y="56" fill="#374151" font-size="20">Private, continuous</text>
      <text y="88" fill="#374151" font-size="20">deployment</text>
      <text y="142" fill="#6b7280" font-size="18">Governance, connectors,</text>
      <text y="172" fill="#6b7280" font-size="18">and outcome memory</text>
    </g>
  </g>
</svg>
